name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# The workflow only needs to read the code. (Secrets are never given to pull requests from forks,
# because this workflow does not run on pull requests.)
permissions:
  contents: write   # needed to update the "latest-build" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare the signing key from GitHub Secrets
        env:
          KS: ${{ secrets.WORTART_KEYSTORE_BASE64 }}
          SP: ${{ secrets.WORTART_STORE_PASSWORD }}
          KA: ${{ secrets.WORTART_KEY_ALIAS }}
          KP: ${{ secrets.WORTART_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing WORTART_KEYSTORE_BASE64"
          [ -z "$SP" ] && missing="$missing WORTART_STORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing WORTART_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing WORTART_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. Add them under Settings > Secrets and variables > Actions (see README, Secure build)."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/wortart.keystore"

      - name: Add google-services.json from a secret (optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" | base64 -d > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret: using app/google-services.json from the repository if it exists."
          fi

      - name: Build APKs (direct + Google Play version)
        env:
          WORTART_STORE_FILE: ${{ runner.temp }}/wortart.keystore
          WORTART_STORE_PASSWORD: ${{ secrets.WORTART_STORE_PASSWORD }}
          WORTART_KEY_ALIAS: ${{ secrets.WORTART_KEY_ALIAS }}
          WORTART_KEY_PASSWORD: ${{ secrets.WORTART_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p dist
          gradle assembleRelease --no-daemon -PPLAY_BUILD=false 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk dist/WortArt-direct.apk
          gradle assembleRelease --no-daemon -PPLAY_BUILD=true 2>&1 | tee -a build.log
          cp app/build/outputs/apk/release/app-release.apk dist/WortArt-play.apk

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |What went wrong|Execution failed|error:|Could not resolve|not found" -A3 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/wortart.keystore"

      # The APKs go to a GitHub Release instead of an Actions "artifact":
      # release files do NOT count against the free Actions artifact storage, so it can never fill up.
      - name: Publish APKs to the "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Automatic build of commit ${{ github.sha }}. Download the APK from the files below."
          files: dist/*.apk
          overwrite_files: true
